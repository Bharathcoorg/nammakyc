openapi: 3.1.0
info:
  title: Namma KYC API
  version: 0.1.0
  description: Open-source citizen-first reference implementation API.
servers:
  - url: https://api.example.invalid
paths:
  /health:
    get:
      operationId: health
      responses:
        "200": {description: Service health}
  /v1/households/{rationCardReference}:
    get:
      operationId: getHousehold
      parameters:
        - {name: rationCardReference, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: Household and member information}
        "400": {description: Invalid ration card reference}
  /v1/kyc:
    post:
      operationId: startKyc
      parameters:
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 16, maxLength: 128}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/StartKycRequest"}
      responses:
        "202": {description: KYC transaction accepted}
        "400": {description: Invalid request}
        "409": {description: Idempotency conflict}
        "502": {description: Provider failure}
  /v1/kyc/{requestId}:
    get:
      operationId: getKycStatus
      parameters:
        - {name: requestId, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: KYC transaction status}
        "404": {description: Transaction not found}
components:
  schemas:
    StartKycRequest:
      type: object
      required: [householdReference, memberReference, consentReference]
      properties:
        householdReference: {type: string, minLength: 1, maxLength: 128}
        memberReference: {type: string, minLength: 1, maxLength: 128}
        consentReference: {type: string, minLength: 1, maxLength: 128}
    KycStatusResponse:
      type: object
      required: [requestId, status]
      properties:
        requestId: {type: string}
        status: {type: string, enum: [received, validating, authenticating, processing, success, retrying, failed]}
        reference: {type: string}
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string}
            message: {type: string}
