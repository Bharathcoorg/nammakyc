<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 220" fill="none">
  <defs>
    <!-- Background subtle warmth -->
    <radialGradient id="sunAura" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#C8942E" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#E5A93C" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0D4A36" stop-opacity="0"/>
    </radialGradient>

    <!-- Ground ambient shadow -->
    <radialGradient id="groundShade" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#082A1F" stop-opacity="0.14"/>
      <stop offset="70%" stop-color="#0D4A36" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#0D4A36" stop-opacity="0"/>
    </radialGradient>

    <!-- Clothing Gradients -->
    <linearGradient id="fatherKurta" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#145E44"/>
      <stop offset="60%" stop-color="#0D4A36"/>
      <stop offset="100%" stop-color="#072F22"/>
    </linearGradient>

    <linearGradient id="motherSaree" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E5A93C"/>
      <stop offset="50%" stop-color="#C8942E"/>
      <stop offset="100%" stop-color="#A57317"/>
    </linearGradient>

    <linearGradient id="motherPallu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A6F52"/>
      <stop offset="100%" stop-color="#0D4A36"/>
    </linearGradient>

    <linearGradient id="sonShirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#238260"/>
      <stop offset="100%" stop-color="#12563D"/>
    </linearGradient>

    <linearGradient id="daughterPavada" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EB7C24"/>
      <stop offset="100%" stop-color="#C25A0B"/>
    </linearGradient>

    <linearGradient id="goldZari" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F2CB6C"/>
      <stop offset="50%" stop-color="#D9A132"/>
      <stop offset="100%" stop-color="#B88018"/>
    </linearGradient>
  </defs>

  <!-- Ambient Light & Soft Sacred Halo -->
  <ellipse cx="210" cy="115" rx="160" ry="92" fill="url(#sunAura)"/>
  <circle cx="210" cy="94" r="76" stroke="#C8942E" stroke-width="1.2" stroke-dasharray="4 6" opacity="0.4"/>
  <circle cx="210" cy="94" r="58" stroke="#166B4F" stroke-width="0.9" opacity="0.25"/>

  <!-- Subtle Grain & PDS Prosperity Sheaf Arc -->
  <path d="M185 30c8-4 17-6 25-6s17 2 25 6" stroke="#C8942E" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <circle cx="210" cy="22" r="3" fill="#C8942E" opacity="0.75"/>
  <circle cx="196" cy="26" r="2.2" fill="#C8942E" opacity="0.6"/>
  <circle cx="224" cy="26" r="2.2" fill="#C8942E" opacity="0.6"/>

  <!-- Grounding Floor Shadow -->
  <ellipse cx="210" cy="204" rx="175" ry="9" fill="url(#groundShade)"/>

  <!-- ========================================================================
       1. FATHER (Left)
       ======================================================================== -->
  <g id="father" class="family-figure">
    <!-- Kurta Body -->
    <path d="M96 202v-58c0-18 14-30 30-32l9-1 9 1c16 2 30 14 30 32v58H96z" fill="url(#fatherKurta)"/>
    <!-- Fold & Shadow lines -->
    <path d="M96 144c10 14 18 28 20 58" stroke="#072F22" stroke-width="1.5" opacity="0.4"/>
    <path d="M174 144c-10 14-18 28-20 58" stroke="#072F22" stroke-width="1.5" opacity="0.4"/>

    <!-- Gold Collar & Placket -->
    <path d="M127 111c0-4 8-6 16-4s10 3 10 4l-4 8c-6 1-16 0-22-8z" fill="#C8942E"/>
    <path d="M135 113v46" stroke="#C8942E" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="135" cy="122" r="1.6" fill="#FFF2CC"/>
    <circle cx="135" cy="132" r="1.6" fill="#FFF2CC"/>
    <circle cx="135" cy="142" r="1.6" fill="#FFF2CC"/>

    <!-- Neck -->
    <path d="M127 111v-12c0-3 16-3 16 0v12z" fill="#DFA77E"/>
    <path d="M127 104c4 3 12 3 16 0v3c-4 3-12 3-16 0z" fill="#CA8E64" opacity="0.4"/>

    <!-- Head -->
    <ellipse cx="135" cy="77" rx="18" ry="22" fill="#E8B48E"/>
    <!-- Soft cheek blush -->
    <ellipse cx="123" cy="84" rx="4" ry="2.5" fill="#DC8966" opacity="0.3"/>
    <ellipse cx="147" cy="84" rx="4" ry="2.5" fill="#DC8966" opacity="0.3"/>

    <!-- Facial Features: Clean, warm & friendly -->
    <!-- Eyebrows -->
    <path d="M123 71c3-2 7-1 9 1" stroke="#0C2017" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M138 72c2-2 6-3 9-1" stroke="#0C2017" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Eyes (gentle smile curves) -->
    <path d="M124 76c2 2 5 2 7 0" stroke="#0C2017" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M139 76c2 2 5 2 7 0" stroke="#0C2017" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- Nose hint -->
    <path d="M135 77v4c0 1 1 2 2 2" stroke="#B87B53" stroke-width="1.4" stroke-linecap="round" fill="none"/>
    <!-- Classic Neat Mustache -->
    <path d="M126 84c3-1 6 0 9 2 3-2 6-3 9-2 1 2-2 3-5 3-3 0-4-2-4-2s-1 2-4 2c-3 0-6-1-5-3z" fill="#0C2017"/>
    <!-- Friendly Smile -->
    <path d="M131 89c2 2 6 2 8 0" stroke="#0C2017" stroke-width="1.6" stroke-linecap="round" fill="none"/>

    <!-- Modern Groomed Hair -->
    <path d="M115 76c-1-16 11-26 23-26 13 0 20 8 20 18 0 4-2 7-3 10-3-9-9-15-19-15-8 0-14 4-17 11l-4 2z" fill="#0C2017"/>
    <!-- Hair Volume Highlight -->
    <path d="M124 55c6-3 14-2 19 2" stroke="#1D4E3A" stroke-width="1.8" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- ========================================================================
       2. MOTHER (Right)
       ======================================================================== -->
  <g id="mother" class="family-figure">
    <!-- Traditional Low Bun & Jasmine Garland (Gajra / Mallige) -->
    <circle cx="306" cy="78" r="14" fill="#0C2017"/>
    <!-- Mallige flower buds ring around bun -->
    <circle cx="306" cy="78" r="17" stroke="#FFFDF6" stroke-width="3" stroke-dasharray="3.5 3.5"/>
    <circle cx="306" cy="78" r="17" stroke="#F5C754" stroke-width="1.2" stroke-dasharray="1 6"/>

    <!-- Saree Body Base -->
    <path d="M246 202v-52c0-18 14-30 32-32l8-1 8 1c18 2 32 14 32 32v52h-80z" fill="url(#motherSaree)"/>
    <!-- Saree pleats shadow -->
    <path d="M276 150v52M284 152v50M292 154v48" stroke="#A57317" stroke-width="1.4" opacity="0.4"/>

    <!-- Emerald Pallu Drape (Diagonal across chest) -->
    <path d="M260 125c10 16 22 42 46 77h18c-26-38-38-66-48-84l-16 7z" fill="url(#motherPallu)"/>
    <!-- Glittering Gold Zari Border on Pallu -->
    <path d="M260 125c10 16 22 42 46 77" stroke="url(#goldZari)" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M260 125c10 16 22 42 46 77" stroke="#0D4A36" stroke-width="1.2" stroke-dasharray="2 2"/>

    <!-- Gold Necklace / Mangalsutra hint -->
    <path d="M277 109c4 6 12 6 16 0" stroke="#C8942E" stroke-width="2" stroke-linecap="round" fill="none"/>
    <circle cx="285" cy="115" r="2" fill="#C8942E"/>

    <!-- Neck -->
    <path d="M277 110v-13c0-3 16-3 16 0v13z" fill="#E8B48E"/>

    <!-- Head -->
    <ellipse cx="285" cy="79" rx="16" ry="20" fill="#ECC09D"/>
    <!-- Rosy cheek blush -->
    <ellipse cx="274" cy="85" rx="3.5" ry="2" fill="#E0866A" opacity="0.35"/>
    <ellipse cx="296" cy="85" rx="3.5" ry="2" fill="#E0866A" opacity="0.35"/>

    <!-- Traditional Crimson Bindi with Gold Core -->
    <circle cx="285" cy="74" r="2.8" fill="#C8942E"/>
    <circle cx="285" cy="74" r="2" fill="#B91C1C"/>

    <!-- Facial Features: Serene & Dignified -->
    <!-- Eyebrows -->
    <path d="M274 72c3-2 7-1 9 1" stroke="#0C2017" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M287 73c2-2 6-3 9-1" stroke="#0C2017" stroke-width="1.6" stroke-linecap="round"/>
    <!-- Eyes with delicate feminine curve -->
    <path d="M275 77c2 2 5 2 7 0" stroke="#0C2017" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M288 77c2 2 5 2 7 0" stroke="#0C2017" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- Warm Graceful Smile -->
    <path d="M281 88c2 2 6 2 8 0" stroke="#0C2017" stroke-width="1.7" stroke-linecap="round" fill="none"/>

    <!-- Hair Drape & Center Parting -->
    <path d="M269 77c-1-14 9-23 20-23 11 0 19 8 20 18 0 4-1 8-2 10-3-8-8-13-17-13-8 0-14 4-17 10l-4-2z" fill="#0C2017"/>
    <!-- Gold Jhumka / Earring -->
    <path d="M269 84l-2 4h4z" fill="#C8942E"/>
    <circle cx="269" cy="82" r="1.8" fill="#C8942E"/>
  </g>

  <!-- ========================================================================
       3. SON (Center-Left)
       ======================================================================== -->
  <g id="son" class="family-figure">
    <!-- Shirt Body -->
    <path d="M162 202v-44c0-14 11-23 24-25l4-1 4 1c13 2 24 11 24 25v44h-56z" fill="url(#sonShirt)"/>
    <!-- Fold shadows -->
    <path d="M162 165c6 10 12 20 14 37" stroke="#0D4A36" stroke-width="1.2" opacity="0.4"/>
    <!-- White Shirt Collar & Buttons -->
    <path d="M185 133l5 12 5-12" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
    <circle cx="190" cy="154" r="1.4" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="190" cy="166" r="1.4" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="190" cy="178" r="1.4" fill="#FFFFFF" opacity="0.9"/>

    <!-- Neck -->
    <path d="M184 133v-9c0-2 12-2 12 0v9z" fill="#DFA77E"/>

    <!-- Head -->
    <ellipse cx="190" cy="108" rx="14" ry="17" fill="#E8B48E"/>
    <!-- Cheek blush -->
    <ellipse cx="180" cy="113" rx="3" ry="1.8" fill="#DC8966" opacity="0.3"/>
    <ellipse cx="200" cy="113" rx="3" ry="1.8" fill="#DC8966" opacity="0.3"/>

    <!-- Cheerful Eyes & Smile -->
    <path d="M181 103c2-1 5-1 6 1" stroke="#0C2017" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M193 104c2-2 5-2 6 1" stroke="#0C2017" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M182 108c1.5 1.8 4 1.8 5 0" stroke="#0C2017" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    <path d="M193 108c1.5 1.8 4 1.8 5 0" stroke="#0C2017" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    <path d="M187 117c2 2 4 2 6 0" stroke="#0C2017" stroke-width="1.5" stroke-linecap="round" fill="none"/>

    <!-- Youthful Hair -->
    <path d="M175 106c0-12 8-18 18-18 8 0 14 5 15 12-2-4-6-7-12-7-7 0-12 3-14 8l-7 5z" fill="#0C2017"/>
  </g>

  <!-- ========================================================================
       4. DAUGHTER (Center-Right)
       ======================================================================== -->
  <g id="daughter" class="family-figure">
    <!-- Two Cute Braids -->
    <path d="M222 144c-2 14-6 26-9 36M248 144c2 14 6 26 9 36" stroke="#0C2017" stroke-width="3.2" stroke-linecap="round"/>
    <circle cx="213" cy="180" r="3.2" fill="#C8942E"/>
    <circle cx="257" cy="180" r="3.2" fill="#C8942E"/>

    <!-- Traditional Pattu Pavada Skirt -->
    <path d="M214 202l4-28h34l4 28h-42z" fill="url(#daughterPavada)"/>
    <!-- Rich Golden Zari Hem Border -->
    <path d="M214 195h42v7h-42z" fill="#C8942E"/>
    <line x1="214" y1="195" x2="256" y2="195" stroke="#FFF2CC" stroke-width="1"/>
    <!-- Emerald Blouse Top -->
    <path d="M220 174v-16c0-10 8-16 15-17l1 0 1 0c7 1 15 7 15 17v16h-32z" fill="#0D4A36"/>
    <!-- Gold neck trim -->
    <path d="M228 142c2 3 6 3 8 0" stroke="#C8942E" stroke-width="2" stroke-linecap="round" fill="none"/>

    <!-- Neck -->
    <path d="M231 142v-8c0-2 10-2 10 0v8z" fill="#ECC09D"/>

    <!-- Head -->
    <ellipse cx="236" cy="122" rx="12" ry="15" fill="#F0C7A6"/>
    <!-- Soft blush -->
    <ellipse cx="228" cy="126" rx="2.8" ry="1.6" fill="#E0866A" opacity="0.4"/>
    <ellipse cx="244" cy="126" rx="2.8" ry="1.6" fill="#E0866A" opacity="0.4"/>
    <!-- Tiny Crimson Bindi -->
    <circle cx="236" cy="117" r="1.5" fill="#B91C1C"/>

    <!-- Happy Eyes & Smile -->
    <path d="M229 119c1.5 1.5 3.5 1.5 5 0" stroke="#0C2017" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    <path d="M238 119c1.5 1.5 3.5 1.5 5 0" stroke="#0C2017" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    <path d="M233 128c1.5 1.8 4.5 1.8 6 0" stroke="#0C2017" stroke-width="1.5" stroke-linecap="round" fill="none"/>

    <!-- Front Hair Fringe -->
    <path d="M224 121c0-10 6-15 14-15 7 0 12 4 13 10-2-3-5-6-10-6-6 0-10 3-12 7l-5 4z" fill="#0C2017"/>
  </g>
</svg>
